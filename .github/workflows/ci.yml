name: tests

on:
  push:
    branches: [main, codex, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [py310, py313]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ${{ matrix.environment }}
          locked: true
      - name: Run offline checks
        run: pixi run -e ${{ matrix.environment }} check
